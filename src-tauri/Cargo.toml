[package]
name = "virtuallab"
version = "0.2.0"
description = "VirtualLab Engineering Workbench"
authors = ["magic-alt"]
edition = "2021"

[lib]
name = "virtuallab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
portable-pty = "0.9"
notify = "8"

sha2 = "0.10.9"
