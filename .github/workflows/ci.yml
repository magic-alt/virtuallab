name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run icons:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  linux-native:
    name: Linux desktop acceptance (Node 26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Cargo does not rewrite the committed lockfile
        shell: bash
        run: |
          cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
          git diff --exit-code -- src-tauri/Cargo.lock
      - run: npm ci
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run acceptance:local

  windows-native:
    name: Windows desktop acceptance (Node 26)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Cargo does not rewrite the committed lockfile
        shell: bash
        run: |
          cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
          git diff --exit-code -- src-tauri/Cargo.lock
      - run: npm ci
      - run: npm run icons:check
      - run: npm run acceptance:local
      - name: Build standalone Windows release host
        run: npm run tauri:build -- --no-bundle

  macos-native:
    name: macOS desktop acceptance (Node 26)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Cargo does not rewrite the committed lockfile
        shell: bash
        run: |
          cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
          git diff --exit-code -- src-tauri/Cargo.lock
      - run: npm ci
      - run: npm run icons:check
      - name: Unix process lifecycle regressions
        timeout-minutes: 3
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml terminal_process::tests -- --nocapture --test-threads=1
          cargo test --locked --manifest-path src-tauri/Cargo.toml managed_process::tests -- --nocapture --test-threads=1
      - name: Run desktop acceptance
        run: npm run acceptance:local
        env:
          # Monaco's production bundle can exceed Node's ~2 GiB default heap
          # on the arm64 macOS runner while Vite transforms worker/language
          # modules. Keep this scoped to the build-bearing acceptance step.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build macOS .app and assert bundled orange-V icon
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run tauri:build -- --bundles app
          APP="src-tauri/target/release/bundle/macos/VirtualLab.app"
          test -d "$APP"
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          ACTUAL_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")"
          test "$EXPECTED_VERSION" = "$ACTUAL_VERSION"
          ICON_NAME="$(plutil -extract CFBundleIconFile raw -o - "$APP/Contents/Info.plist")"
          test -n "$ICON_NAME"
          cmp "src-tauri/icons/icon.icns" "$APP/Contents/Resources/$ICON_NAME"
          # The old test only compared bytes; Dock still rendered malformed red/black.
          # Decode the *packaged* ICNS using Apple's native icon readers.
          iconutil --convert iconset --output "$RUNNER_TEMP/VirtualLab.iconset" "$APP/Contents/Resources/$ICON_NAME"
          sips -s format png "$APP/Contents/Resources/$ICON_NAME" --out "$RUNNER_TEMP/VirtualLab-rendered.png"
          test -s "$RUNNER_TEMP/VirtualLab-rendered.png"
          swift scripts/validate-macos-icon.swift "$APP/Contents/Resources/$ICON_NAME"
