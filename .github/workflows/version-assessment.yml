name: Automatic version assessment

# Trusted post-merge mainline version metadata is independent of platform CI.
# GitHub's GITHUB_TOKEN main updates cannot recursively trigger push workflows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatic-version-assessment
  cancel-in-progress: false

jobs:
  assess:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Only trusted default-branch code is executed with the write token.
      # Do not download artifacts or check out a PR/workflow_run head here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assess merged PRs and synchronize qualified version metadata
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { resolve } = await import('node:path');
            const moduleUrl = pathToFileURL(resolve('scripts/version-automation.mjs')).href;
            const { runVersionAutomation } = await import(moduleUrl);
            const result = await runVersionAutomation({ github, context, core });
            core.info(`Version assessment: ${result.status}`);
      - name: Verify generated version sources
        run: node scripts/version.mjs check
