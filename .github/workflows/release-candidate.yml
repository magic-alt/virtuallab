name: Release Candidate (unsigned QA bundles)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    # Only RC branches produce artifacts on PRs. Maintainers can dispatch manually.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/')
    name: Unsigned QA bundle - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install exact npm dependency graph
        run: npm ci
      - name: Validate version, icons, release bundle tooling
        run: |
          npm run version:check
          npm run icons:check
          node --test scripts/rc-assets.node-check.mjs
      - name: Full frontend/Rust automated acceptance (does not test GUI)
        run: npm run acceptance:local
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Build Windows unsigned NSIS installer
        if: runner.os == 'Windows'
        run: npm run tauri:build -- --bundles nsis
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Build macOS unsigned app
        if: runner.os == 'macOS'
        run: npm run tauri:build -- --bundles app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Build Linux unsigned .deb
        if: runner.os == 'Linux'
        run: npm run tauri:build -- --bundles deb
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Package artifact plus source SHA and SHA-256 provenance
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/rc-assets.mjs package ${{ matrix.platform }}
      - name: Independently verify saved manifest and asset hashes
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/rc-assets.mjs verify ${{ matrix.platform }}
      - name: Upload QA artifacts (never GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: virtuallab-rc-${{ matrix.platform }}-${{ github.sha }}
          path: dist-release/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
