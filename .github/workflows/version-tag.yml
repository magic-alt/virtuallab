name: Version tag verification

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check-version-tag:
    name: Verify tagged application version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Ensure tag matches npm/Tauri/Cargo and both lockfiles
        run: npm run version:check -- --tag "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
