# Temporary branch-only generator. Removed after Cargo.lock is refreshed.
name: Notification plugin lockfile
on:
  push:
    branches:
      - feat/terminal-agent-desktop-notifications
permissions:
  contents: write
jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve added Tauri notification dependency
        run: cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
      - name: Commit resolved Cargo.lock if necessary
        shell: bash
        run: |
          git add src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "chore: lock Tauri native notification dependency"
            git push origin HEAD:feat/terminal-agent-desktop-notifications
          fi
