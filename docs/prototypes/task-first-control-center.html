<style>

none;padding:11px 12px}.nav button.active{background:#30271f}.sidefoot{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.main{min-width:0;display:flex;flex-direction:column}.topbar{padding:14px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;min-height:65px}.search{max-width:390px;margin-left:auto}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#393026;color:var(--orange);font-size:10px}main{padding:25px 26px;flex:1}.heading{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}.heading p{color:var(--muted);margin-top:5px}.eyebrow{font-size:10px;color:var(--orange);letter-spacing:1.8px;margin-bottom:6px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{background:var(--panel);border:1px solid var(--line);padding:15px 18px;border-radius:8px}.stat b{display:block;font-size:27px;margin-top:5px}.stat small{font-size:11px}.scenario{padding:12px 15px;border:1px solid var(--line);border-radius:8px;margin-bottom:20px;background:#1e1f20;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.scenario select{flex:1;min-width:180px}.scenario small{flex-basis:100%;font-size:12px}.workbench{display:grid;grid-template-columns:minmax(265px,.85fr) minmax(0,1.65fr);gap:16px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:9px;overflow:hidden}.panelhead{padding:15px 17px;border-bottom:1px solid var(--line)}.filters{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}.filters button{font-size:12px;padding:4px 9px}.tasklist{padding:8px;max-height:600px;overflow:auto}.task{display:block;width:100%;text-align:left;padding:15px 12px;border:1px solid transparent;background:none;margin-bottom:5px}.task.selected{background:#2d2722;border-color:#805936}.task h3{margin:8px 0}.task p{font-size:12px;color:var(--muted)}.task .id{font-size:10px;letter-spacing:1px;color:var(--muted)}.badge{display:inline-flex;white-space:nowrap;border:1px solid #48494d;border-radius:4px;background:#2a2b2e;color:#c8c9ce;font-size:11px;padding:2px 7px}.badge.warn{background:#332a20;border-color:#6e5134;color:#efc18f}.badge.pass{background:#233029;border-color:#415d4d;color:var(--green)}.badge.fail{background:#352527;border-color:#684448;color:var(--red)}.badge.info{background:#252e38;border-color:#44556a;color:#adc4e0}.detailhead{padding:20px}.detailhead h2{margin:8px 0}.detailhead p{color:var(--muted);font-size:12px}.tabs{display:flex;overflow:auto;padding:0 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.tabs button{white-space:nowrap;border:0;border-radius:0;background:none;color:var(--muted);padding:12px 10px}.tabs button.active{color:var(--orange);box-shadow:inset 0 -2px var(--orange)}.detailbody{padding:20px;min-height:350px;max-height:550px;overflow:auto}.notice{background:#2d261f;border:1px solid #6a5036;border-radius:6px;color:#e7c5a1;padding:12px 14px;margin:0 0 18px;font-size:12px}.notice.good{background:#222e27;border-color:#425d4c;color:#bad9c6}.notice.bad{background:#2e2224;border-color:#674348;color:#e4b5b1}.stategrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 20px}.statebox{padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px}.statebox small{display:block;margin-bottom:7px}.kv{display:grid;grid-template-columns:105px 1fr;gap:8px 12px;font-size:12px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}.sectiontitle{margin:20px 0 10px}.actions{display:flex;gap:8px;flex-wrap:wrap;padding:15px 20px;border-top:1px solid var(--line)}.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}.node{padding:12px;flex:1;min-width:125px;background:var(--bg);border:1px solid var(--line);border-radius:6px;font-size:12px}.node b{display:block;margin-bottom:6px}.check{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.log{font:12px/1.9 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#111213;border:1px solid var(--line);border-radius:6px;padding:14px;max-height:240px;overflow:auto;color:#bcbfc5}.timeline{margin:12px 6px;border-left:1px solid #69513b;padding-left:18px}.event{margin-bottom:16px;font-size:12px}.event small{display:block}.terminal{padding:10px 26px 14px;border-top:1px solid var(--line);background:#111213}.terminal summary{cursor:pointer}.terminal .log{border:0;padding:4px 0;margin:7px 0 0;max-height:110px}.empty{padding:30px;text-align:center;color:var(--muted)}.fullpanel{padding:22px}.help p{margin:14px 0;color:var(--muted)}dialog{width:min(740px,calc(100% - 30px));max-height:90vh;overflow:auto;padding:0;background:var(--panel);color:var(--text);border:1px solid #72563c;border-radius:12px}dialog::backdrop{background:#000b;backdrop-filter:blur(3px)}.modalhead{padding:22px;border-bottom:1px solid var(--line)}.modalbody{padding:22px}.modalfoot{display:flex;justify-content:space-between;gap:10px;padding:16px 22px;border-top:1px solid var(--line)}.steps{display:flex;gap:8px;margin-top:18px}.step{flex:1;font-size:11px;border-top:2px solid var(--line);padding:8px;color:var(--muted)}.step.current{color:var(--orange);border-color:var(--orange)}label{display:block;margin:14px 0 6px;font-size:12px;color:var(--muted)}input[type=checkbox]{width:auto;margin-right:7px}.draftcard{margin:10px 0;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:90vw;padding:12px 20px;border:1px solid #96714b;border-radius:8px;background:#3b3025;color:#f5dbbe;z-index:50;box-shadow:0 8px 30px #0008}.toast:empty{display:none}@media(min-width:1600px){main{max-width:1500px;width:100%;margin:auto}}@media(max-width:1050px){.app{grid-template-columns:160px 1fr}main{padding:20px 16px}.topbar{padding:12px 16px}.workbench{grid-template-columns:260px minmax(0,1fr)}.stat{padding:12px}.tabs button{padding:12px 7px}}@media(max-width:800px){.app{grid-template-columns:1fr}aside{padding:12px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:17px}.brand small,.sidefoot{display:none}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap;padding:8px 10px}.workbench{grid-template-columns:1fr}.tasklist{max-height:265px}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.mockbar{padding:8px 12px}.mockbar span{display:none}.mockbar strong{font-size:12px}.heading{align-items:flex-start}.heading h1{font-size:22px}.topbar{flex-wrap:wrap;gap:8px}.search{max-width:none;flex:1;min-width:150px}.terminal{padding:10px 16px}.detailbody{max-height:none}.steps{gap:3px}.step{padding:6px 2px}}
</style></head><body>
<div class="mockbar"><div><strong>◈ 离线交互原型 · 全部为模拟数据</strong> <span>不连接仓库、AI、终端或原生服务</span></div><button id="reset">↺ 重置演示</button></div><div class="app"><aside><div class="brand"><b>V</b> VirtualLab<small>ENGINEERING WORKBENCH</small></div><nav class="nav" aria-label="主导航" id="nav"></nav><div class="sidefoot">● 离线演示模式<br><br>工作区拥有资源<br>任务引用工作区<br>Agent 附着于工作区</div></aside><div class="main"><header class="topbar"><span class="muted">演示空间 /</span><strong id="breadcrumb">控制中心</strong><input class="search" id="search" type="search" aria-label="搜索任务" placeholder="搜索任务名称、编号或 SHA…"><span class="badge">本地 · MOCK</span><span class="avatar">YOU</span></header><main id="content"></main><details class="terminal" open><summary><strong>底部终端</strong> <span class="badge">只读演示</span> <small>工作区所有 · 无输入、无进程、无 shell</small></summary><pre class="log" id="terminalLog" aria-live="polite"></pre></details></div></div><dialog id="wizard" aria-labelledby="wizardTitle"></dialog><dialog id="confirm" aria-labelledby="confirmTitle"></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const navs=[['home','◈','控制中心'],['tasks','▤','任务'],['repositories','▣','仓库'],['evidence','◇','证据'],['settings','⚙','设置'],['help','?','应用帮助']];
const scenarios=['并行执行 · 等待依赖','分支通过 · 集成失败','修复提交 · 旧证据失效','重新验证 → 评审 → 接受','中断恢复 · 结果未知','资源冲突 · 共享预留'];
const tabs=['概览','计划与依赖','执行记录','验证证据','评审与交付'];
let state,view='home',selected='T-103',tab=0,filter='all',query='',wizardStep=0,draft={},toastTimer;
function task(id,title,kind){return{id,title,kind,execution:'queued',sha:kind==='integration'?'mock-int-c301':'mock-'+id.toLowerCase()+'-a101',input:'input-01',profile:'profile-v2',toolchain:'toolchain-01',attempt:1,runs:[],review:null,acceptance:null,prepared:true,events:['任务已登记 · 仅内存演示'],scope:kind==='integration'?'共享边界 / 集成验证':'界面行为 / 任务约定'};}
function identity(t){return[t.sha,t.input,t.profile,t.toolchain].join('|');}
function latest(t){return t.runs.at(-1);}
function evidenceCurrent(t){return !!latest(t)&&latest(t).identity===identity(t);}
function evidencePass(t){const e=latest(t);return evidenceCurrent(t)&&e.status==='pass'&&e.checks.length===3&&e.checks.every(c=>c.status==='pass');}
function reviewCurrent(t){return !!t.review&&t.review.identity===identity(t)&&t.review.runId===latest(t)?.id&&t.review.approved;}
function accepted(t){return !!t.acceptance&&t.acceptance.identity===identity(t)&&t.acceptance.runId===latest(t)?.id&&reviewCurrent(t)&&evidencePass(t);}
function blockers(t){const b=[];if(t.execution!=='succeeded')b.push('执行尚未成功完成');if(!latest(t))b.push('缺少独立验证证据');else if(!evidenceCurrent(t))b.push('证据绑定的 SHA / 输入 / Profile / 工具链已过期');else if(!evidencePass(t))b.push('必需检查失败或缺失');if(!reviewCurrent(t))b.push('缺少当前验证 Run 的人工评审');if(t.kind==='integration'&&!state.integrated)b.push('尚未确认集成固定来源');return b;}
function canAccept(t){return blockers(t).length===0;}
function record(t,message){t.events.push(message);state.log.push('['+t.id+'] '+message);}
function run(t,status){const n=t.runs.length+1;t.runs.push({id:'Run-'+n,identity:identity(t),sha:t.sha,input:t.input,profile:t.profile,toolchain:t.toolchain,status,checks:[{name:'类型与契约',status:'pass'},{name:'行为检查',status:'pass'},{name:t.kind==='integration'?'集成边界检查':'范围检查',status}]});record(t,'独立验证 Run-'+n+' · '+status.toUpperCase()+'（模拟）');}
function loadScenario(n){state={scenario:n,integrated:false,fixed:false,reserved:n===5,log:['[MOCK] 离线演示初始化；没有执行任何命令。'],tasks:[task('T-101','任务列表与注意事项','implementation'),task('T-102','证据与交付契约','implementation'),task('T-103','集成交付 · Task-first 控制中心','integration')]};const[a,b,t]=state.tasks;a.execution=b.execution=n===0?'running':'succeeded';if(n!==0){run(a,'pass');run(b,'pass');}if(n>=1&&n<=3){state.integrated=true;t.execution='succeeded';run(t,n===3?'pass':'fail');}if(n===2){t.review={identity:identity(t),runId:latest(t).id,approved:false,note:'历史评审：集成失败，需修复'};state.fixed=true;t.sha='mock-int-c302';t.input='input-02';record(t,'修复已生成新 SHA；旧证据与历史评审均过期');}if(n===4){a.execution='interrupted';a.sha='mock-unknown';a.runs=[];record(a,'恢复：发现未确认的变更意图，结果未知；没有自动重放');selected='T-101';}else selected=n===5?'T-101':'T-103';if(n===5){a.execution='queued';a.runs=[];record(a,'资源占用：演示工作区被模拟终端预留为潜在写入者');}tab=0;filter='all';query='';$('#search').value='';render();}
function badge(text,type=''){return '<span class="badge '+type+'">'+esc(text)+'</span>';}
function execLabel(t){return{queued:'等待',running:'运行中',succeeded:'执行完成',failed:'执行失败',interrupted:'已中断 · 未知'}[t.execution];}
function evLabel(t){return !latest(t)?['未验证','']:!evidenceCurrent(t)?['已过期','warn']:evidencePass(t)?['PASS · 模拟','pass']:['FAIL / 缺失 · 模拟','fail'];}
function readyLabel(t){return accepted(t)?['已接受','pass']:canAccept(t)?['待人工接受','warn']:evidencePass(t)&&t.execution==='succeeded'?['待人工评审','info']:['交付阻塞','warn'];}
function getTask(){return state.tasks.find(t=>t.id===selected)||state.tasks[0];}
function toast(s){$('#toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',4200);}
function render(){const t=getTask();$('#breadcrumb').textContent=navs.find(n=>n[0]===view)[2];$('#nav').innerHTML=navs.map(n=>'<button data-nav="'+n[0]+'" class="'+(view===n[0]?'active':'')+'">'+n[1]+'　'+n[2]+'</button>').join('');$('#terminalLog').textContent=state.log.slice(-8).join('\n');if(view==='home'||view==='tasks')renderWorkbench(t);else renderPage();}
function renderWorkbench(t){$('#content').innerHTML='<div class="heading"><div><div class="eyebrow">TASK-FIRST / LOCAL CONTROL</div><h1>'+(view==='home'?'把工程进展变成可交付结果':'任务')+'</h1><p>从目标到证据，每一步都有清晰的边界。</p></div><button class="primary" data-action="create">＋ 创建任务</button></div><div class="stats"><div class="stat"><small>并行执行 / 上限 2</small><b>'+state.tasks.filter(x=>x.execution==='running').length+' <span class="muted" style="font-size:15px">/ 2</span></b></div><div class="stat"><small>需要关注</small><b>'+state.tasks.filter(x=>!accepted(x)).length+'</b></div><div class="stat"><small>当前证据通过 · 模拟</small><b>'+state.tasks.filter(evidencePass).length+'</b></div><div class="stat"><small>人工接受</small><b>'+state.tasks.filter(accepted).length+'</b></div></div><section class="scenario" aria-label="模拟场景选择"><strong>场景实验台</strong><select id="scenario" aria-label="选择演示场景">'+scenarios.map((s,i)=>'<option value="'+i+'" '+(state.scenario===i?'selected':'')+'>'+String(i+1).padStart(2,'0')+' · '+s+'</option>').join('')+'</select><span class="badge warn">切换会重置模拟状态</span><small>按 01 → 02 → 03 → 04 体验；05 / 06 演示恢复与资源预留。也可通过下方操作逐步推进。</small></section><div class="workbench"><section class="panel"><div class="panelhead"><div class="row spread"><h3>任务队列 · '+state.tasks.length+'</h3><span class="badge">示例仓库 · MOCK</span></div><div class="filters">'+[['all','全部'],['attention','需关注'],['running','运行中'],['accepted','已接受']].map(([v,l])=>'<button data-filter="'+v+'" class="'+(filter===v?'active':'')+'">'+l+'</button>').join('')+'</div></div><div class="tasklist">'+taskList()+'</div></section><section class="panel" aria-label="任务详情"><div class="detailhead"><div class="row spread"><span class="mono muted">'+esc(t.id)+' / '+(t.kind==='integration'?'INTEGRATION':'IMPLEMENTATION')+'</span>'+badge(...readyLabel(t))+'</div><h2>'+esc(t.title)+'</h2><p>工作区拥有资源 · '+(t.prepared?'已显式准备模拟工作区':'尚未创建模拟工作区')+' · Attempt '+t.attempt+'</p></div><div class="tabs" role="tablist" aria-label="任务详情标签">'+tabs.map((l,i)=>'<button role="tab" id="tab-'+i+'" aria-controls="detailTab" aria-selected="'+(tab===i)+'" data-tab="'+i+'" class="'+(tab===i?'active':'')+'">'+l+'</button>').join('')+'</div><div class="detailbody" id="detailTab" role="tabpanel" aria-labelledby="tab-'+tab+'">'+detail(t)+'</div><div class="actions">'+actions(t)+'</div></section></div>';}
function taskList(){const list=state.tasks.filter(t=>(!query||[t.title,t.id,t.sha].join(' ').toLowerCase().includes(query.toLowerCase()))&&(filter==='all'||filter==='attention'&&!accepted(t)||filter==='running'&&t.execution==='running'||filter==='accepted'&&accepted(t)));return list.length?list.map(t=>'<button class="task '+(selected===t.id?'selected':'')+'" data-task="'+t.id+'"><div class="row spread"><span class="id">'+t.id+'</span>'+badge(execLabel(t),t.execution==='running'?'info':t.execution==='interrupted'?'warn':'')+'</div><h3>'+esc(t.title)+'</h3><p>'+(t.kind==='integration'?'← T-101 + T-102 · 专用集成工作区':'独立工作区 · 范围受限')+'</p><div class="row" style="margin-top:10px">'+badge(...evLabel(t))+badge(...readyLabel(t))+'</div></button>').join(''):'<div class="empty">没有匹配的任务。<br>可清空搜索或切换过滤条件。</div>';}
function detail(t){const b=blockers(t),e=latest(t);if(tab===0)return '<div class="notice '+(accepted(t)?'good':'')+'">'+(accepted(t)?'已接受当前版本；输入变化或新 Run 会使接受不适用。':b.length?esc(b[0])+'。Agent 完成不代表验证通过或交付就绪。':'当前证据和人工评审有效，请单独确认接受。')+'</div><h3>四种状态，分别判断</h3><div class="stategrid"><div class="statebox"><small>① 执行结果</small>'+badge(execLabel(t))+'</div><div class="statebox"><small>② 观察到的检查</small>'+badge(...evLabel(t))+'</div><div class="statebox"><small>③ 当前交付状态</small>'+badge(...readyLabel(t))+'</div><div class="statebox"><small>④ 人工接受</small>'+badge(accepted(t)?'适用于当前版本':t.acceptance?'历史接受已失效':'尚未接受',accepted(t)?'pass':'')+'</div></div><dl class="kv"><dt>目标</dt><dd>'+esc(t.title)+'</dd><dt>模拟 SHA</dt><dd class="mono">'+esc(t.sha)+'</dd><dt>输入 / Profile</dt><dd class="mono">'+esc(t.input)+' / '+esc(t.profile)+'</dd><dt>观察工具链</dt><dd class="mono">'+esc(t.toolchain)+'</dd><dt>工作区</dt><dd>虚构逻辑标识 workspace-'+t.id+'（不是文件路径）</dd><dt>资源</dt><dd>'+(state.reserved?'模拟终端占用，写入操作阻塞':'可用 · 共享生命周期预留')+'</dd></dl>';
if(tab===1)return '<h3>已接受的结构化计划</h3><p class="muted">两个叶子任务并行；专用集成任务等待固定来源。</p><div class="flow"><div class="node"><b>T-101 · 列表</b>'+badge(execLabel(state.tasks[0]))+'</div><span>＋</span><div class="node"><b>T-102 · 证据</b>'+badge(execLabel(state.tasks[1]))+'</div><span>→</span><div class="node"><b>T-103 · 集成</b>'+badge(state.integrated?'已确认集成':'依赖等待','warn')+'</div></div><div class="notice">接受计划、准备工作区、执行、集成确认是不同操作。页面导航不会触发执行。</div><dl class="kv"><dt>并发 / 排队上限</dt><dd>2 / 32 个叶子任务（演示约定）</dd><dt>允许范围</dt><dd>'+esc(t.scope)+'</dd><dt>候选封存</dt><dd>只模拟候选 SHA，没有真实 Git 提交</dd><dt>来源快照</dt><dd class="mono">'+esc(state.tasks[0].sha)+'<br>'+esc(state.tasks[1].sha)+'</dd></dl>';
if(tab===2)return '<div class="row spread"><h3>Attempt '+t.attempt+'</h3>'+badge(execLabel(t))+'</div><p class="muted">重试新增 Attempt；重新验证新增 Run。</p><div class="timeline">'+t.events.map((s,i)=>'<div class="event"><small>EVENT '+String(i+1).padStart(3,'0')+' · MOCK</small>'+esc(s)+'</div>').join('')+'</div><div class="log">'+esc('只读结构化事件演示\n'+t.events.join('\n'))+'</div>';
if(tab===3)return '<div class="row spread"><h3>独立验证 · Evidence v2 演示</h3>'+badge(...evLabel(t))+'</div><p class="muted">分支 PASS 不能代替最终集成输入的验证。</p>'+(!e?'<div class="empty">暂无验证 Run。执行完成后请显式验证。</div>':'<h3 class="sectiontitle">'+e.id+' · 绑定身份</h3><dl class="kv"><dt>证据 SHA</dt><dd class="mono">'+esc(e.sha)+'</dd><dt>当前 SHA</dt><dd class="mono">'+esc(t.sha)+'</dd><dt>输入摘要</dt><dd class="mono">'+esc(e.input)+'</dd><dt>Profile / 工具链</dt><dd class="mono">'+esc(e.profile)+' / '+esc(e.toolchain)+'</dd><dt>适用性</dt><dd>'+(evidenceCurrent(t)?'身份匹配':'已过期，禁止用于接受')+'</dd></dl>'+e.checks.map(c=>'<div class="check"><span>'+esc(c.name)+' <small>必需</small></span>'+badge(c.status.toUpperCase()+' · 模拟',c.status==='pass'?'pass':'fail')+'</div>').join('')+'<div class="log" style="margin-top:14px">'+esc('模拟报告 / '+e.id+'\n观察结果：'+e.status.toUpperCase()+'\n'+(e.status==='fail'?'集成边界：分支独立通过，共享契约组合失败。':'本次模拟记录；不是实际工程合格证。'))+'</div>')+'<h3 class="sectiontitle">历史 Run · '+t.runs.length+'</h3>'+t.runs.map(r=>'<div class="check"><span>'+r.id+' · '+esc(r.sha)+'</span>'+badge(r.identity===identity(t)?r.status.toUpperCase():'历史 / 过期',r.identity!==identity(t)?'warn':r.status==='pass'?'pass':'fail')+'</div>').join('');
return '<div class="notice '+(canAccept(t)||accepted(t)?'good':'bad')+'">'+(accepted(t)?'已人工接受当前 SHA、输入、Profile 与验证 Run。':b.length?'接受被阻止：'+b.map(esc).join('；'):'当前验证与人工评审有效，可单独确认接受。')+'</div><h3>人工评审</h3><p class="muted">阅读证据并记录评审；评审不会自动接受交付。</p><label for="reviewNote">评审备注</label><textarea id="reviewNote" placeholder="已核对集成边界与当前证据。">'+esc(t.review?.note||'')+'</textarea><div class="row" style="margin-top:12px"><button data-action="review" '+(!evidencePass(t)||t.execution!=='succeeded'?'disabled':'')+'>记录人工评审通过</button>'+badge(reviewCurrent(t)?'当前评审有效':t.review?'历史评审不适用':'未评审',reviewCurrent(t)?'pass':'warn')+'</div><h3 class="sectiontitle">交付接受</h3><p class="muted">绑定当前版本和 Run；身份变化或新 Run 要求重新评审。</p><div class="row" style="margin-top:12px"><button class="primary" data-action="accept" '+(!canAccept(t)||accepted(t)?'disabled':'')+'>人工接受此交付</button>'+badge(accepted(t)?'已接受':'未接受',accepted(t)?'pass':'')+'</div><h3 class="sectiontitle">历史记录</h3><dl class="kv"><dt>评审绑定</dt><dd class="mono">'+esc(t.review?.identity||'—')+'</dd><dt>接受绑定</dt><dd class="mono">'+esc(t.acceptance?.identity||'—')+'</dd></dl>';}
function actions(t){let h='';if(!t.prepared)h+='<button data-action="prepare">准备模拟工作区</button>';if(t.execution==='queued'&&t.kind==='implementation')h+='<button class="primary" data-action="start" '+(!t.prepared||state.reserved?'disabled':'')+'>开始模拟执行</button>';if(state.scenario===0&&state.tasks.slice(0,2).every(x=>x.execution==='running'&&x.prepared))h+='<button data-action="branches">完成两个并行任务（模拟）</button>';if(t.kind==='integration'&&!state.integrated)h+='<button class="primary" data-action="integrate" '+((!t.prepared||state.reserved||!state.tasks.slice(0,2).every(x=>x.execution==='succeeded'&&evidencePass(x)))?'disabled':'')+'>预览并确认模拟集成</button>';if(t.execution==='running')h+='<button data-action="finish">完成当前执行（模拟）</button>';if(t.execution==='succeeded')h+='<button data-action="verify" '+(state.reserved?'disabled':'')+'>'+(latest(t)?'重新独立验证':'独立验证')+'（模拟）</button>';if(t.kind==='integration'&&state.integrated&&latest(t)&&!evidencePass(t)&&!state.fixed)h+='<button data-action="fix">模拟修复 · 生成新 SHA</button>';if(t.execution==='interrupted')h+='<button data-action="inspect">只读检查未知结果</button><button data-action="retry">显式重试 · 新 Attempt</button>';if(state.reserved)h+='<button data-action="release">模拟占用者退出 · 释放资源</button>';if(t.execution==='succeeded')h+='<button data-action="input">模拟输入变化 · SHA 不变</button><button data-action="missing">模拟必需检查缺失</button>';return h||'<span class="muted">在「评审与交付」中继续，或切换场景。</span>';}
function renderPage(){let body='';if(view==='repositories')body='<h2>示例仓库 · MOCK</h2><p class="muted">虚构标识，无真实路径，不访问文件或 Git。</p><div class="stategrid"><div class="statebox">3 个示例工作区<small>资源属于工作区，任务引用工作区。</small></div><div class="statebox">'+badge(state.reserved?'资源已预留':'资源可用',state.reserved?'warn':'pass')+'<small>模拟写入操作共享资源预留。</small></div></div><button data-nav="tasks">查看关联任务</button>';if(view==='evidence')body='<h2>证据索引</h2><p class="muted">全部为内存模拟记录，不代表真实工程合格。</p>'+state.tasks.map(t=>'<div class="check"><span>'+esc(t.title)+'<br><small>'+t.runs.length+' 个 Run · '+esc(t.sha)+'</small></span><div class="row">'+badge(...evLabel(t))+'<button data-evidence="'+t.id+'">查看证据</button></div></div>').join('');if(view==='settings')body='<h2>演示设置</h2><dl class="kv"><dt>运行模式</dt><dd>完全离线 · 单文件 · 无持久化</dd><dt>页面刷新</dt><dd>恢复默认场景；不会恢复或重放操作</dd><dt>AI 规划</dt><dd>预置模拟建议；实际产品需合格只读能力</dd><dt>并行上限</dt><dd>2 个模拟任务</dd><dt>数据边界</dt><dd>无网络、原生桥接、shell、真实仓库或外部资源</dd></dl>';if(view==='help')body='<div class="help"><h2>原型体验指南</h2><p>① 创建任务：定义目标 → 模拟 AI 建议 → 编辑计划 → 接受计划。然后显式准备工作区并开始执行。</p><p>② 默认场景：两个并行任务 + 等待中的集成任务。完成分支，预览并确认固定来源的集成，再独立验证，观察集成失败。</p><p>③ 模拟修复改变 SHA，旧证据和评审不适用。重新验证 → 人工评审 → 人工接受，三个动作单独完成。</p><p>④ 额外模拟同 SHA 输入变化、缺失检查。中断恢复不重放未知操作；资源冲突需等待占用者退出。</p><p>搜索匹配名称、编号和 SHA。使用 Tab 导航、Enter / 空格激活按钮、Esc 关闭弹窗。详情含五个标签，日志与证据独立滚动。</p><p>全部 PASS、SHA、验证与评审均为虚构。此原型仅供视觉和交互评审，不代表后端功能或平台资格。</p></div>';$('#content').innerHTML='<div class="heading"><div><div class="eyebrow">LOCAL / MOCK</div><h1>'+navs.find(n=>n[0]===view)[2]+'</h1></div><button class="primary" data-action="create">＋ 创建任务</button></div><section class="panel fullpanel">'+body+'</section>';}
function openWizard(){wizardStep=0;draft={goal:'让工程任务从执行进展走向有证据的交付',title1:'任务列表与注意事项',title2:'证据与交付契约',scope1:'列表与注意事项',scope2:'验证证据与交付',manual:false};renderWizard();$('#wizard').showModal();}
function saveDraft(){['goal','title1','title2','scope1','scope2'].forEach(k=>{const el=$('#draft-'+k);if(el)draft[k]=el.value.trim();});}
function renderWizard(){const names=['定义目标','规划建议','编辑计划','接受计划'];let body='';if(wizardStep===0)body='<p class="muted">只创建模拟任务；不会选择或访问真实仓库。</p><label>目标<input id="draft-goal" maxlength="240" value="'+esc(draft.goal)+'"></label><label>仓库范围<select aria-label="模拟仓库"><option>示例仓库 · MOCK（固定、虚构）</option></select></label>';if(wizardStep===1)body='<div class="notice">实际 AI 规划需要合格只读会话；此处完全离线，只展示预置建议。</div><div class="row"><button data-wiz="suggest" class="'+(!draft.manual?'active':'')+'">使用模拟 AI 建议</button><button data-wiz="manual" class="'+(draft.manual?'active':'')+'">手动规划</button></div><h3 class="sectiontitle">'+(draft.manual?'手动计划草稿':'模拟 AI 建议 · 可编辑')+'</h3><div class="draftcard">1. '+esc(draft.title1)+' · 独立工作区</div><div class="draftcard">2. '+esc(draft.title2)+' · 独立工作区</div><div class="draftcard">3. 集成交付 ← 两个叶子任务</div><p class="muted">建议须由用户编辑并接受。</p>';if(wizardStep===2)body='<p class="muted">两个叶子任务并行，集成任务依赖两者。固定在同一模拟仓库。</p>'+[1,2].map(i=>'<div class="draftcard"><label>叶子任务 '+i+' 名称<input id="draft-title'+i+'" maxlength="80" value="'+esc(draft['title'+i])+'"></label><label>允许范围<input id="draft-scope'+i+'" maxlength="120" value="'+esc(draft['scope'+i])+'"></label></div>').join('');if(wizardStep===3)body='<div class="notice">接受计划只冻结结构，不创建工作区、不执行、不集成。</div><h3>'+esc(draft.goal)+'</h3><div class="draftcard">'+esc(draft.title1)+'<br><small>'+esc(draft.scope1)+'</small></div><div class="draftcard">'+esc(draft.title2)+'<br><small>'+esc(draft.scope2)+'</small></div><div class="draftcard">集成交付 ← 两个叶子任务<br><small>必需检查：类型与契约 / 行为检查 / 集成边界检查</small></div><label><input type="checkbox" id="planAck">我已检查模拟计划，理解后续动作需显式触发。</label>';$('#wizard').innerHTML='<div class="modalhead"><div class="row spread"><h2 id="wizardTitle">创建任务 · 四步计划</h2><button data-wiz="close" aria-label="关闭创建任务">✕</button></div><div class="steps">'+names.map((n,i)=>'<span class="step '+(wizardStep===i?'current':'')+'">'+(i+1)+' '+n+'</span>').join('')+'</div></div><div class="modalbody">'+body+'</div><div class="modalfoot"><button data-wiz="back" '+(wizardStep===0?'disabled':'')+'>上一步</button><button class="primary" data-wiz="next">'+(wizardStep===3?'接受模拟计划':'下一步')+'</button></div>';}
function ask(title,body,callback){$('#confirm').innerHTML='<div class="modalhead"><h2 id="confirmTitle">'+esc(title)+'</h2></div><div class="modalbody">'+body+'</div><div class="modalfoot"><button id="cancelConfirm">取消</button><button class="primary" id="yesConfirm">确认模拟操作</button></div>';$('#cancelConfirm').onclick=()=>$('#confirm').close();$('#yesConfirm').onclick=()=>{$('#confirm').close();callback();render();};$('#confirm').showModal();}
function act(a){const t=getTask();if(a==='create'){openWizard();return;}if(a==='prepare'){if(state.reserved){toast('资源已预留，禁止准备工作区');return;}t.prepared=true;record(t,'用户显式准备模拟工作区');}if(a==='start'){if(t.execution!=='queued'||state.reserved||!t.prepared||state.tasks.filter(x=>x.execution==='running').length>=2){toast('资源占用、工作区未准备或并发已满');return;}t.execution='running';record(t,'用户显式开始模拟执行');}if(a==='finish'){if(t.execution!=='running'||state.reserved)return;t.execution='succeeded';record(t,'Agent 模拟完成；尚未验证');}if(a==='branches'){if(state.reserved||!state.tasks.slice(0,2).every(x=>x.execution==='running'&&x.prepared))return;state.tasks.slice(0,2).forEach(x=>{x.execution='succeeded';run(x,'pass');});toast('分支通过，集成仍需用户确认与独立验证');}if(a==='integrate'){if(!t.prepared||state.reserved||!state.tasks.slice(0,2).every(x=>x.execution==='succeeded'&&evidencePass(x)))return;const snapshot=state.tasks.slice(0,2).map(identity).join('::');ask('确认固定来源的模拟集成','<div class="notice">只变更内存状态，无 Git 操作。</div><dl class="kv"><dt>来源一</dt><dd class="mono">'+esc(state.tasks[0].sha)+'</dd><dt>来源二</dt><dd class="mono">'+esc(state.tasks[1].sha)+'</dd><dt>专用目标</dt><dd class="mono">workspace-T-103 / '+esc(t.sha)+'</dd></dl><p>集成完成后仍须独立验证最终输入。</p>',()=>{if(!t.prepared||state.reserved||snapshot!==state.tasks.slice(0,2).map(identity).join('::')){toast('来源或资源已变化，必须重新预览');return;}state.integrated=true;t.execution='succeeded';record(t,'用户确认固定来源，模拟集成完成；未验证');});return;}if(a==='verify'){if(t.execution!=='succeeded'||state.reserved)return;run(t,t.kind==='integration'&&!state.fixed&&state.scenario!==3?'fail':'pass');toast('新增验证 Run；请阅读证据再人工评审');}if(a==='fix'){if(state.reserved){toast('资源占用，无法修复');return;}if(!t.review)t.review={identity:identity(t),runId:latest(t).id,approved:false,note:'修复前评审：集成检查失败'};state.fixed=true;t.sha='mock-int-c302';t.input='input-02';record(t,'修复生成新 SHA；历史证据、评审与接受不适用');toast('新 SHA 已生成，必须重新验证');}if(a==='input'){t.input=t.input==='input-01'?'input-02':'input-01';record(t,'受控输入变化，HEAD 不变；旧证据不适用');}if(a==='missing'){if(!latest(t)){toast('尚无证据');return;}latest(t).checks[2].status='missing';latest(t).status='missing';record(t,'必需检查缺失，接受已阻止');}if(a==='review'){if(!evidencePass(t)||t.execution!=='succeeded')return;t.review={identity:identity(t),runId:latest(t).id,approved:true,note:$('#reviewNote')?.value.trim()||'已人工核对当前模拟证据'};record(t,'用户记录当前版本与 Run 的人工评审通过；尚未接受');toast('评审已记录，请单独接受交付');}if(a==='accept'){if(!canAccept(t)||accepted(t)){toast('缺少有效证据或当前评审，拒绝接受');return;}const bound=identity(t),runId=latest(t).id;ask('人工接受此模拟交付','<p>接受单独记录，并绑定以下当前身份。</p><div class="log">'+esc(bound)+'\n'+esc(runId)+'</div><p class="muted">这不是实际交付、发布或合格证明。</p>',()=>{if(!canAccept(t)||bound!==identity(t)||runId!==latest(t).id){toast('输入已变化，拒绝接受');return;}t.acceptance={identity:identity(t),runId};record(t,'用户显式接受当前交付 · 模拟');toast('当前模拟交付已接受');});return;}if(a==='inspect'){record(t,'只读观察：候选封存结果仍未知，旧 Attempt 保持 interrupted');toast('没有重放操作；如需继续，请显式新建 Attempt');}if(a==='retry'){if(t.execution!=='interrupted')return;if(state.reserved){toast('资源占用，禁止重试');return;}ask('为中断任务创建新 Attempt','<p>旧 Attempt 保留中断记录。不重放未知操作；模拟从新候选开始。</p>',()=>{t.attempt++;t.execution='running';t.sha='mock-retry-'+t.attempt;t.runs=[];record(t,'用户显式创建 Attempt '+t.attempt+'；旧 Attempt 未重放');});return;}if(a==='release'){state.reserved=false;record(t,'模拟占用者已观察到退出；生命周期预留释放');toast('资源释放后请显式开始任务');}render();}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b){view=b.dataset.nav;render();}});
$('#content').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav){view=b.dataset.nav;render();}else if(b.dataset.task){selected=b.dataset.task;render();}else if(b.dataset.evidence){selected=b.dataset.evidence;tab=3;view='tasks';render();}else if(b.dataset.tab!==undefined){tab=Number(b.dataset.tab);render();$('#tab-'+tab).focus();}else if(b.dataset.filter){filter=b.dataset.filter;render();}else if(b.dataset.action)act(b.dataset.action);});
$('#content').addEventListener('change',e=>{if(e.target.id==='scenario')loadScenario(Number(e.target.value));});
$('#search').addEventListener('input',e=>{query=e.target.value;view='tasks';render();});
$('#reset').onclick=()=>{view='home';$('#wizard').close();$('#confirm').close();loadScenario(0);toast('演示已重置；无持久化或真实操作');};
$('#wizard').addEventListener('click',e=>{const b=e.target.closest('[data-wiz]');if(!b)return;saveDraft();const a=b.dataset.wiz;if(a==='close'){$('#wizard').close();return;}if(a==='manual'||a==='suggest'){draft.manual=a==='manual';renderWizard();return;}if(a==='back')wizardStep=Math.max(0,wizardStep-1);if(a==='next'){if(!draft.goal||wizardStep===2&&(!draft.title1||!draft.title2||!draft.scope1||!draft.scope2)){toast('请填写目标、两个任务名称与允许范围');return;}if(wizardStep===3){if(!$('#planAck').checked){toast('请先确认已检查模拟计划');return;}loadScenario(0);state.tasks.forEach((t,i)=>{t.execution='queued';t.prepared=false;t.events=['用户接受结构化计划；未创建工作区'];if(i<2){t.title=draft['title'+(i+1)];t.scope=draft['scope'+(i+1)];}});selected='T-101';state.log.push('[MOCK] 计划已接受；等待显式准备与执行。');$('#wizard').close();view='tasks';render();toast('计划已接受。请显式准备工作区并开始执行');return;}wizardStep++;}renderWizard();});
loadScenario(0);
</script></body></html>
